# DOS: Google Chrome flags. Installed to ~/.config/chrome-flags.conf by
# modules/30-chrome; dos-update overwrites it (the old copy is kept as .bak).
#
# Read by the AUR google-chrome launcher (/usr/bin/google-chrome-stable):
#   CHROME_USER_FLAGS="$(grep -v '^#' $XDG_CONFIG_HOME/chrome-flags.conf)"
# So: comments must start in column 1, no inline comments, no spaces inside a
# flag, and at most ONE --enable-features line (only the last one counts).
#
# Native Wayland via Ozone. Chrome 140+ picks Wayland on its own when
# WAYLAND_DISPLAY is set; DOS only runs under sway, so say it explicitly.
--ozone-platform=wayland
#
# VA-API hardware video decode (Intel HD 520, intel-media-driver / iHD).
# Source: Arch Wiki "Chromium#Hardware video acceleration" (checked 2026-11):
#   Chrome 143+ decodes with VA-API out of the box on Wayland; the feature is
#   AcceleratedVideoDecodeLinuxGL (renamed from VaapiVideoDecodeLinuxGL in 131).
#   The old AcceleratedVideoDecodeLinuxZeroCopyGL feature was folded in at 143.
# Source: chromium media/base/media_switches.cc (main): kAcceleratedVideoDecodeLinuxGL
#   is FEATURE_ENABLED_BY_DEFAULT. Enabling it here keeps decode on if a
#   field trial ever turns it off. Encode (AcceleratedVideoEncoder) is left off:
#   upstream marks Linux VA-API "not supported, no guarantees".
--enable-features=AcceleratedVideoDecodeLinuxGL
#
# RAM and CPU on 2 cores / 8 GB: share one renderer process per site instead of
# one per tab of that site. Documented in the Arch Wiki "Reduce memory usage".
# Memory Saver (tab discarding) is set by policy instead:
# /etc/opt/chrome/policies/managed/dos.json
--process-per-site
