# DOS: managed by modules/40-spotify. dos-update overwrites this file.
# Read by spotify-launcher from ~/.config/spotify-launcher.conf (TOML).
# Check what gets passed with: spotify-launcher -v --skip-update --no-exec
[spotify]
# Run as a native Wayland client under sway. It skips XWayland, which costs
# less RAM and CPU and scales cleanly. These are the flags from the
# spotify-launcher sample config. If Spotify won't start, use `spotify --x11`.
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
# The first launch downloads about 100+ MB. Keep resuming on a slow connection.
download_attempts = 10
