[package]
name = "dos-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The DOS Shell: the DOS> command prompt of Dhruv's Operating System"
license = "MIT"
publish = false

[[bin]]
name = "dos-shell"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
