name: E2E
# Full simulation: build the ISO, boot it in a UEFI VM next to a disk shaped
# exactly like the laptop's, install DOS for real, then boot the installed DOS
# through GRUB. See tests/e2e/run.sh.
on:
  push:
    branches: [claude]
    paths:
      - 'iso/**'
      - 'scripts/build-iso.sh'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'iso/**'
      - 'scripts/build-iso.sh'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build ISO (archlinux container)
        run: |
          docker run --rm --privileged -e GITHUB_SHA -v "$PWD:/repo" -w /repo archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso &&
            DOS_VERSION="e2e-${GITHUB_SHA::7}" DOS_ISO_FAST=1 WORK_DIR=/tmp/dos-build bash scripts/build-iso.sh'
          ls -lh out/
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf grub-efi-amd64-bin gdisk ntfs-3g dosfstools e2fsprogs libarchive-tools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM: the VMs will be slow"
      - name: Run the simulation
        run: sudo bash tests/e2e/run.sh out/*.iso
      - name: Logs
        if: always()
        run: |
          for f in /var/tmp/dos-e2e/live.log /var/tmp/dos-e2e/boot.log; do
            echo "::group::$f"; sudo tail -c 200000 "$f" 2>/dev/null | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' || true; echo "::endgroup::"
          done
