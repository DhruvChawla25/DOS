name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: { find . -name '*.sh' -not -path './.git/*' -print0; printf '%s\0' iso/airootfs/usr/local/bin/*; } | xargs -0 -r shellcheck -x
