name: ISO
on:
  # Only PRs that change what goes into the ISO; module PRs don't need it.
  pull_request:
    paths:
      - 'iso/**'
      - 'scripts/build-iso.sh'
      - '.github/workflows/iso.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only used on tags, to attach the ISO to a release
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm --needed archiso github-cli
      - name: Build ISO
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          # Non-release builds use zstd instead of xz: much faster to build.
          fast=1; [[ "$GITHUB_REF_TYPE" == tag ]] && fast=0
          DOS_VERSION="$v" DOS_ISO_FAST="$fast" bash scripts/build-iso.sh
      # Private repos have little artifact storage, so the ISO goes straight to a
      # release (release files don't count against it) and only for version tags.
      - name: Attach ISO to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.iso --repo "$GITHUB_REPOSITORY" \
            --title "DOS $GITHUB_REF_NAME" --notes "Flash with balenaEtcher, boot with F12."
