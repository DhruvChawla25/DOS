name: ISO
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only used on tags, to attach the ISO to a release
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm --needed archiso github-cli
      - name: Build ISO
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          DOS_VERSION="$v" bash scripts/build-iso.sh
      # Private repos have little artifact storage, so the ISO goes straight to a
      # release (release files don't count against it) and only for version tags.
      - name: Attach ISO to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" out/*.iso --repo "$GITHUB_REPOSITORY" \
            --title "DOS $GITHUB_REF_NAME" --notes "Flash with balenaEtcher, boot with F12."
